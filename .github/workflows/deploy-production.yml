name: Deploy API to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - '.github/workflows/deploy-production.yml'
      - 'Dockerfile'
      - 'deploy/azure/**'
      - 'drizzle/**'
      - 'drizzle.config.ts'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig.json'
      - 'vitest.config.ts'
  workflow_dispatch:

concurrency:
  group: production-api
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  validate:
    name: Validate API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

  deploy:
    name: Build image and deploy API
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps CLI
        run: az extension add --name containerapp --upgrade --output none

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        id: image
        shell: bash
        run: |
          # GHCR image names must be lowercase.
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

          docker build --tag "${image}" .
          docker push "${image}"

      - name: Check image is publicly pullable
        shell: bash
        run: |
          # Container Apps pulls without credentials, so the GHCR package must be public.
          repo="${GITHUB_REPOSITORY,,}"
          token="$(curl --silent "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)"
          if ! curl --fail --silent --output /dev/null \
            --header "Authorization: Bearer ${token}" \
            --header "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${repo}/manifests/${GITHUB_SHA}"; then
            echo "::error::ghcr.io/${repo} is not public. Set the package visibility to Public, then re-run this job."
            exit 1
          fi

      - name: Deploy container revision
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          APP_PORT: ${{ secrets.API_PORT }}
          AZURE_STORAGE_ACCESS_TIER: ${{ secrets.AZURE_STORAGE_ACCESS_TIER }}
          AZURE_STORAGE_CONNECTION_SECRET_NAME: ${{ secrets.AZURE_STORAGE_CONNECTION_SECRET_NAME }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          CLIENT_SECRET_NAME: ${{ secrets.CLIENT_SECRET_NAME }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FILE_STORAGE_DRIVER: ${{ secrets.FILE_STORAGE_DRIVER }}
          GM_API_KEY_SECRET_NAME: ${{ secrets.GM_API_KEY_SECRET_NAME }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          JWT_SECRET_NAME: ${{ secrets.JWT_SECRET_NAME }}
          MAX_UPLOAD_MB: ${{ secrets.MAX_UPLOAD_MB }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          UPLOADS_LOCAL_DIR: ${{ secrets.UPLOADS_LOCAL_DIR }}
          # Discord bot: repository variable DISCORD_ENABLED must be exactly 'true' or 'false'.
          DISCORD_ENABLED: ${{ vars.DISCORD_ENABLED }}
          # The bot token lives in this GitHub secret; the deploy copies it into the Container App.
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_IDS: ${{ secrets.DISCORD_GUILD_IDS }}
          DISCORD_GM_USER_IDS: ${{ secrets.DISCORD_GM_USER_IDS }}
          DISCORD_ANNOUNCE_CHANNEL_ID: ${{ secrets.DISCORD_ANNOUNCE_CHANNEL_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          # NPC portraits (Fotor): repository variable FOTOR_ENABLED must be exactly 'true' or 'false'.
          FOTOR_ENABLED: ${{ vars.FOTOR_ENABLED }}
          FOTOR_API_KEY: ${{ secrets.FOTOR_API_KEY }}
          FOTOR_WEBHOOK_SECRET: ${{ secrets.FOTOR_WEBHOOK_SECRET }}
        run: |
          discord_set=()
          discord_remove=()
          case "${DISCORD_ENABLED}" in
            true)
              for name in DISCORD_TOKEN DISCORD_GUILD_IDS DISCORD_GM_USER_IDS SITE_URL PUBLIC_API_URL; do
                if [ -z "${!name}" ]; then
                  echo "::error::DISCORD_ENABLED=true but the ${name} secret is empty."
                  exit 1
                fi
              done
              az containerapp secret set \
                --name "${CONTAINER_APP_NAME}" \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --secrets "discord-token=${DISCORD_TOKEN}" \
                --output none
              # DISCORD_ANNOUNCE_CHANNEL_ID may be empty on purpose (announcements off).
              discord_set=(
                DISCORD_TOKEN="secretref:discord-token"
                DISCORD_GUILD_IDS="${DISCORD_GUILD_IDS}"
                DISCORD_GM_USER_IDS="${DISCORD_GM_USER_IDS}"
                DISCORD_ANNOUNCE_CHANNEL_ID="${DISCORD_ANNOUNCE_CHANNEL_ID}"
                SITE_URL="${SITE_URL}"
              )
              ;;
            false)
              discord_remove=(DISCORD_TOKEN DISCORD_GUILD_IDS DISCORD_GM_USER_IDS DISCORD_ANNOUNCE_CHANNEL_ID SITE_URL)
              ;;
            *)
              echo "::error::Repository variable DISCORD_ENABLED must be 'true' or 'false' (got '${DISCORD_ENABLED}')."
              exit 1
              ;;
          esac

          fotor_set=()
          fotor_remove=()
          case "${FOTOR_ENABLED}" in
            true)
              for name in FOTOR_API_KEY FOTOR_WEBHOOK_SECRET PUBLIC_API_URL; do
                if [ -z "${!name}" ]; then
                  echo "::error::FOTOR_ENABLED=true but the ${name} secret is empty."
                  exit 1
                fi
              done
              az containerapp secret set \
                --name "${CONTAINER_APP_NAME}" \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --secrets "fotor-api-key=${FOTOR_API_KEY}" "fotor-webhook-secret=${FOTOR_WEBHOOK_SECRET}" \
                --output none
              fotor_set=(
                FOTOR_API_KEY="secretref:fotor-api-key"
                FOTOR_WEBHOOK_SECRET="secretref:fotor-webhook-secret"
              )
              ;;
            false)
              fotor_remove=(FOTOR_API_KEY FOTOR_WEBHOOK_SECRET)
              ;;
            *)
              echo "::error::Repository variable FOTOR_ENABLED must be 'true' or 'false' (got '${FOTOR_ENABLED}')."
              exit 1
              ;;
          esac

          # PUBLIC_API_URL is shared by both features: removed only when neither is on.
          shared_set=()
          remove=("${discord_remove[@]}" "${fotor_remove[@]}")
          if [ "${DISCORD_ENABLED}" = true ] || [ "${FOTOR_ENABLED}" = true ]; then
            shared_set=(PUBLIC_API_URL="${PUBLIC_API_URL}")
          else
            remove+=(PUBLIC_API_URL)
          fi
          remove_args=()
          if [ ${#remove[@]} -gt 0 ]; then remove_args=(--remove-env-vars "${remove[@]}"); fi

          az containerapp update \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${{ steps.image.outputs.image }}" \
            --set-env-vars \
              PORT="${APP_PORT}" \
              NODE_ENV="${NODE_ENV}" \
              DATABASE_URL="${DATABASE_URL}" \
              CORS_ORIGIN="${CORS_ORIGIN}" \
              FILE_STORAGE_DRIVER="${FILE_STORAGE_DRIVER}" \
              UPLOADS_LOCAL_DIR="${UPLOADS_LOCAL_DIR}" \
              AZURE_STORAGE_CONTAINER="${AZURE_STORAGE_CONTAINER}" \
              AZURE_STORAGE_ACCESS_TIER="${AZURE_STORAGE_ACCESS_TIER}" \
              AZURE_STORAGE_CONNECTION_STRING="secretref:${AZURE_STORAGE_CONNECTION_SECRET_NAME}" \
              GM_API_KEY="secretref:${GM_API_KEY_SECRET_NAME}" \
              MAX_UPLOAD_MB="${MAX_UPLOAD_MB}" \
              CLIENT_SECRET="secretref:${CLIENT_SECRET_NAME}" \
              JWT_SECRET="secretref:${JWT_SECRET_NAME}" \
              JWT_EXPIRES_IN="${JWT_EXPIRES_IN}" \
              APP_VERSION="${GITHUB_SHA}" \
              "${discord_set[@]}" \
              "${fotor_set[@]}" \
              "${shared_set[@]}" \
            "${remove_args[@]}" \
            --output none

      - name: Health check
        shell: bash
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          # Wait for THIS commit: during the swap the old revision still answers healthy.
          for attempt in {1..36}; do
            version="$(curl --fail --silent "${API_HEALTH_URL}" | jq -r '.version // empty' 2>/dev/null || true)"
            if [ "${version}" = "${GITHUB_SHA}" ]; then
              echo "API is serving ${GITHUB_SHA}"
              exit 0
            fi
            echo "API serves '${version:-unknown}', waiting for ${GITHUB_SHA} (${attempt}/36)..."
            sleep 10
          done

          echo "::error::The new revision (${GITHUB_SHA}) never started serving."
          exit 1

      - name: Discord bot check
        shell: bash
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
          DISCORD_ENABLED: ${{ vars.DISCORD_ENABLED }}
        run: |
          # The deploy step already rejected any value other than 'true' / 'false'.
          if [ "${DISCORD_ENABLED}" = true ]; then expected=ready; else expected=off; fi
          for attempt in {1..18}; do
            body="$(curl --silent "${API_HEALTH_URL}/discord" || true)"
            state="$(echo "${body}" | jq -r '.state // empty' 2>/dev/null || true)"
            version="$(echo "${body}" | jq -r '.version // empty' 2>/dev/null || true)"
            if [ "${state}" = "${expected}" ] && [ "${version}" = "${GITHUB_SHA}" ]; then
              echo "Discord bot: ${state}"
              exit 0
            fi
            echo "Discord bot is '${state:-unknown}', expected '${expected}' (${attempt}/18): ${body}"
            sleep 10
          done

          echo "::error::Discord bot did not reach '${expected}': ${body}"
          exit 1
